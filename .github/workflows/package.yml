name: Package

# Builds .deb and .rpm packages for a release tag and attaches them to its
# GitHub Release. Called by release.yml when semantic-release cuts a tag
# (tags pushed with GITHUB_TOKEN don't trigger `on: push: tags` workflows),
# or run manually to (re)package an existing tag.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. v0.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # Runs before checkout so a malformed tag never reaches `ref:` below.
      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag: $TAG"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      # electron-builder's bundled fpm is x86_64-only, so arm64 uses the system gem.
      - name: Install fpm (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y ruby ruby-dev
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Releases are tag-only, so package.json's version is stale; the tag is the truth.
      - name: Set version from tag
        run: npm pkg set version="${TAG#v}"

      - name: Package
        run: make package-deb package-rpm ARCH=${{ matrix.arch }}

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Upload to GitHub Release
        working-directory: packages
        run: |
          sha256sum -- *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" -- *.deb *.rpm SHA256SUMS
