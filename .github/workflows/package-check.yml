name: Package check

# Temporary (#0032): remove after merge (P2).
# Proves the Electron 44 + node-pty bundle packages on both architectures and
# that the unpacked pty.node matches the target architecture. Builds a .deb
# only: no upload, no release.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/0032-major-deps-upgrade'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            elf: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # electron-builder's bundled fpm is x86_64-only, so arm64 uses the system gem.
      - name: Install fpm (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package
        run: make package-deb ARCH=${{ matrix.arch }}

      - name: Assert pty.node matches the target architecture
        env:
          ELF: ${{ matrix.elf }}
        run: |
          pty=$(find release -path '*app.asar.unpacked/node_modules/node-pty/*' -name pty.node | head -n 1)
          if [ -z "$pty" ]; then
            echo "::error::pty.node not found under app.asar.unpacked/node_modules/node-pty/"
            exit 1
          fi
          echo "$pty"
          file "$pty"
          file "$pty" | grep -q "$ELF"
