name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write # push the release tag, create the GitHub release
      issues: write # comment on issues resolved by the release
      pull-requests: write # comment on PRs included in the release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint src --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      # Empty when semantic-release found nothing to release.
      - name: Detect new release tag
        id: tag
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n1)" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write # attach packages to the release
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
