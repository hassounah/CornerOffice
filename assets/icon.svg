<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with subtle gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="icon-green" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Dashboard icon scaled to fit — original is 24x24, scaled ~13.3x, centered -->
  <!-- Offset: (512 - 24*13.33) / 2 = 96, scale factor = 13.33 -->
  <g transform="translate(96, 96) scale(13.333)">
    <!-- Top-left larger -->
    <rect x="3" y="3" width="10" height="10" rx="2" stroke="url(#icon-green)" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Top-right -->
    <rect x="16" y="3" width="5" height="5" rx="1.5" stroke="url(#icon-green)" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Bottom-right -->
    <rect x="16" y="11" width="5" height="10" rx="1.5" stroke="url(#icon-green)" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Bottom-left -->
    <rect x="3" y="16" width="10" height="5" rx="1.5" stroke="url(#icon-green)" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
